<!DOCTYPE html>

  <title>contact — yasmine kaci chaouche</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #ffffff;
      color: #1a1a1a;
      font-family: Arial, sans-serif;
      font-size: 16px;
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;

      padding: 2rem 2.5rem;
      z-index: 100;

    }

    .nav-links a {
      font-size: 0.85rem;
      color: #1a1a1a;
      text-decoration: none;
    }

    .nav-links a:hover { color: #888; }

    .contact-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 2.5rem;
    }

    .contact-info {
      margin-top: 2rem;
    }

    .contact-text {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 2rem;
      max-width: 320px;
      line-height: 1.6;
    }

    .contact-info a {
      display: block;
      font-size: 0.9rem;
      color: #1a1a1a;
      text-decoration: none;
      margin-bottom: 0.8rem;
      letter-spacing: 0.02em;

  <nav>
